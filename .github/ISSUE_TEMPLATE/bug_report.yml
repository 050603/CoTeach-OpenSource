name: 问题反馈
description: 提交可脱敏复现的功能问题
body:
  - type: markdown
    attributes:
      value: "安全漏洞请按 SECURITY.md 私下报告。不要上传真实课堂数据、教材、密钥、Cookie、浏览器登录状态或完整模型响应。"
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、预期与实际结果
      description: 使用合成数据，说明教师或学生角色及最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与运行环境
      description: 提交 SHA、操作系统、Node/pnpm、浏览器和部署方式；不要填写私有地址或凭据。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查正文和附件，不含真实个人数据或凭据。
          required: true
