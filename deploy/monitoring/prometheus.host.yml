# Host-network deployment only. Keep the bridge-network prometheus.yml intact.
# Add exporter jobs only when their actual services/listeners have been enabled.
# Missing exporter series are unknown, not zero or a passing health check.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: openpbl
    scheme: http
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitor_token
    static_configs:
      - targets: ["127.0.0.1:18082"]
