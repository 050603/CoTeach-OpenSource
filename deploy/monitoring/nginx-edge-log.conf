# Optional http-context include; mounted only by docker-compose.nginx-edge.yml.
# Fixed route names only: never log raw URI/query, cookie, user or request body.
map $uri $openpbl_edge_route {
    default "";
    ~^/api/server-providers/?$ /api/server-providers;
    ~^/api/courses/?$ /api/courses;
    ~^/api/openmaic/classroom/?$ /api/openmaic/classroom;
    ~^/api/openmaic/progress/?$ /api/openmaic/progress;
    ~^/api/learning-events/?$ /api/learning-events;
    ~^/api/ai-collaboration/code/?$ /api/ai-collaboration/code;
    ~^/api/ai-collaboration/document/?$ /api/ai-collaboration/document;
    ~^/api/ai-collaboration/memory/?$ /api/ai-collaboration/memory;
    ~^/api/courses/[^/]+/state/?$ /api/courses/:courseId/state;
    ~^/api/courses/[^/]+/events/?$ /api/courses/:courseId/events;
    ~^/api/courses/[^/]+/projection/?$ /api/courses/:courseId/projection;
    ~^/api/courses/[^/]+/presence/?$ /api/courses/:courseId/presence;
    ~^/api/courses/[^/]+/public-discussion/?$ /api/courses/:courseId/public-discussion;
    ~^/api/courses/[^/]+/actions/?$ /api/courses/:courseId/actions;
}
map $request_method $openpbl_edge_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $openpbl_edge_route $openpbl_edge_loggable {
    "" 0;
    default 1;
}
log_format openpbl_edge_json escape=json
    '{"version":1,"atSeconds":"$msec","method":"$openpbl_edge_method",'
    '"route":"$openpbl_edge_route","status":$status,"requestSeconds":"$request_time",'
    '"upstreamSeconds":"$upstream_response_time","connectSeconds":"$upstream_connect_time",'
    '"headerSeconds":"$upstream_header_time","bytes":$bytes_sent,"edgeId":"$request_id",'
    '"httpRequestId":"$upstream_http_x_openpbl_http_request_id"}';
access_log /var/log/openpbl-edge/current.ndjson openpbl_edge_json buffer=32k flush=1s if=$openpbl_edge_loggable;
