# Location-only opt-in. The http-level format/map is mounted by the same overlay.
# Nginx access_log inheritance is replaced by this location's old action log;
# adding this second destination restores exactly one edge record per action.
access_log /var/log/openpbl-edge/current.ndjson openpbl_edge_json buffer=32k flush=1s if=$openpbl_edge_loggable;
